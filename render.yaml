# Render Blueprint — free web service. Database: use a free Neon Postgres (Render's free Postgres expires after 30 days).
# Deploy: push this repo to GitHub → Render dashboard → New → Blueprint → select the repo → fill in the secret values.
services:
  - type: web
    name: trendsaathi
    runtime: node
    plan: free
    region: singapore
    # --include=dev: NODE_ENV=production would otherwise skip build tools (TypeScript, Tailwind, tsx).
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run on every start (idempotent) — works on the free plan.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: APP_URL
        sync: false # e.g. https://trendsaathi.onrender.com
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql://…?sslmode=require)
      - key: ADMIN_EMAILS
        sync: false
      # Free open-source AI: Groq (open-weight gpt-oss / Qwen models). Create a free key at console.groq.com.
      - key: AI_PROVIDER
        value: groq
      - key: OPENAI_COMPAT_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      # Free trend source (no key)
      - key: SOURCE_GOOGLE_TRENDS_RSS_ENABLED
        value: "true"
      - key: TRENDSAATHI_USER_AGENT
        sync: false # e.g. TrendSaathi/1.0 (+https://your-domain)
      - key: INGEST_SECRET
        generateValue: true
      # Keep demo off for real users (set both to true only for a public demo deployment)
      - key: TRENDSAATHI_DEMO_MODE
        value: "false"
