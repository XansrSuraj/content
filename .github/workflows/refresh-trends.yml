# Optional, free: refreshes trend data every 2 hours by calling the protected ingest endpoint.
# The app also refreshes Google Trends on demand, so this only keeps data warm while nobody is using it.
# Set repository secrets APP_URL (https://…) and INGEST_SECRET (same value as on the server).
name: Refresh trends
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INGEST_SECRET" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $INGEST_SECRET" "$APP_URL/api/jobs/ingest"
